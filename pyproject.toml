[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidown"
version = "1.1.1"
description = "Industrial-grade multi-platform CLI & TUI video downloader and media processor."
authors = [{ name = "ApvCode" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.8.0",
    "InquirerPy>=0.3.4",
    "yt-dlp>=2026.8.19",
    "imageio-ffmpeg>=0.5.1",
    "requests>=2.31.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
omnidown = "omnidown.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnidown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests as requiring internet connectivity (deselect with '-m \"not network\"')",
]
